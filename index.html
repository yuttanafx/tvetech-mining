<!DOCTYPE html> <html lang="th"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>TVET Deep Tech Mining</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <style> html, body { height: 100%; margin: 0; padding: 0; background: #090d16; font-family: 'Segoe UI', sans-serif; color: #fff; overflow: hidden; } .app-container { background: #0b0f19; border: 1px solid #1f2937; border-radius: 30px; padding: 20px; width: 95%; max-width: 350px; height: 95vh; margin: 10px auto; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; } .logo-img { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto; border: 2px solid #fbbf24; } .balance-value { font-size: 40px; font-weight: 800; font-family: monospace; color: #fff; margin: 5px 0; } .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; } .stat-card { background: #111827; border: 1px solid #374151; padding: 12px; border-radius: 15px; text-align: left; } .stat-value { font-size: 14px; font-weight: bold; color: #fbbf24; margin-top: 5px; } .stat-label { font-size: 8px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; } .btn { width: 100%; padding: 14px; font-size: 14px; font-weight: bold; border-radius: 15px; border: none; cursor: pointer; margin-bottom: 8px; transition: 0.3s; } .btn-stop { background: #ef4444; color: #fff; } .btn-claim { background: #10b981; color: #fff; } .btn-add { background: #374151; color: #fff; } .login-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: #090d16; z-index:9999; display: flex; align-items:center; justify-content:center; padding: 20px; } .input-field { width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#000; color:#fff; margin-bottom:10px; box-sizing:border-box; } </style> </head> <body> <div id="loginSection" class="login-overlay"> <div style="width:100%; max-width:300px;"> <input type="text" id="userInput" class="input-field" placeholder="Username"> <input type="password" id="passInput" class="input-field" placeholder="Password"> <button class="btn" style="background:#fbbf24; color:#000;" onclick="loginAction()">Login</button> </div> </div> <div class="app-container"> <div> <img src="https://i.postimg.cc/ncjSwbjv/Gemini-Generated-Image-ncdze7ncdze7ncdz-removebg-preview.png" class="logo-img"> <div id="currentLoggedUser" style="font-size:11px; color:#fbbf24; margin-top:5px;">User: tve001</div> <div class="balance-value" id="balanceDisplay">0.2040</div> </div> <div class="dashboard-grid"> <div class="stat-card"><div class="stat-label">EFFICIENCY</div><div class="stat-value">98.5%</div></div> <div class="stat-card"><div class="stat-label">CARBON OFFSET</div><div class="stat-value">0.34 tCO2</div></div> </div> <canvas id="miningChart" style="max-height: 150px; width: 100%; margin: 10px 0;"></canvas> <div> <button class="btn btn-stop" onclick="toggleMining()">Stop</button> <button class="btn btn-claim" onclick="claimReward()">Claim Credit</button> <button class="btn btn-add" onclick="addTokenManual()">+ Add TVE</button> </div> </div> <script> // กราฟสวยงาม const ctx = document.getElementById('miningChart').getContext('2d'); new Chart(ctx, { type: 'line', data: { labels: ['','','','','',''], datasets: [{ data: [0.1, 0.4, 0.2, 0.6, 0.3, 0.5], borderColor: '#fbbf24', tension: 0.5, fill: true, backgroundColor: 'rgba(251, 191, 36, 0.1)' }] }, options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { display: false } } } }); function loginAction() { document.getElementById("loginSection").style.display = "none"; } function toggleMining() { alert("Mining Stopped"); } async function claimReward() { alert("Claiming..."); } async function addTokenManual() { alert("Adding Token..."); } </script> </body> </html>
