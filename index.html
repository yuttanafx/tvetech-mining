<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TVET NODE-07 | Advanced Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --gold: #fbbf24;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --bg: #030305;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background: var(--bg); color: #fff; overflow-x: hidden;
            background: radial-gradient(circle at 50% -20%, #1a1a2e 0%, #030305 80%);
        }

        .app-container {
            width: 100%; max-width: 450px; margin: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* Header Style */
        .top-header { display: flex; justify-content: space-between; align-items: center; }
        .node-title { font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #fff; }
        .node-sub { font-size: 10px; color: var(--gold); letter-spacing: 1px; }

        /* Reactor Animation */
        .reactor-wrap { height: 220px; display: flex; align-items: center; justify-content: center; position: relative; }
        .reactor-logo { width: 110px; height: 110px; border-radius: 50%; box-shadow: 0 0 40px rgba(251, 191, 36, 0.4); z-index: 2; }

        /* Dashboard Grid */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card {
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid var(--border); border-radius: 20px; padding: 16px;
        }
        .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .stat-value { font-size: 20px; font-weight: 700; color: var(--gold); margin-top: 5px; }

        /* Balance Area */
        .balance-area { text-align: center; margin: 10px 0; }
        .balance-value { font-size: 48px; font-weight: 900; color: var(--gold); }
        
        /* Buttons */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 14px; border: none; border-radius: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-full { grid-column: span 2; background: linear-gradient(135deg, #9333ea, #4c1d95); color: #fff; }
        .btn-red { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; }
        .btn-green { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #10b981; }

        /* Graph Box */
        .graph-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 20px; border: 1px solid var(--border); }

        #bg3d { position: fixed; inset: 0; z-index: -1; }
    </style>
</head>
<body>

    <div id="bg3d"></div>

    <div class="app-container">
        <div class="top-header">
            <div>
                <div class="node-title">TVET NODE-07</div>
                <div class="node-sub">DEEP TECH MINING</div>
            </div>
            <div style="color:#10b981; font-size: 12px;">● LIVE</div>
        </div>

        <div class="reactor-wrap">
            <img class="reactor-logo" src="https://i.postimg.cc/ncjSwbjv/Gemini-Generated-Image-ncdze7ncdze7ncdz-removebg-preview.png">
        </div>

        <div class="balance-area">
            <div class="balance-value" id="balanceDisplay">0.2370 <span style="font-size: 20px;">TVE</span></div>
        </div>

        <div class="dashboard-grid">
            <div class="stat-card"><div class="stat-label">EFFICIENCY</div><div class="stat-value">97.5%</div></div>
            <div class="stat-card"><div class="stat-label">HASH RATE</div><div class="stat-value">132 TH/s</div></div>
        </div>

        <div class="graph-box">
            <canvas id="miningChart" height="150"></canvas>
        </div>

        <div class="btn-group">
            <button class="btn btn-red" onclick="toggleMining()">STOP</button>
            <button class="btn btn-green" onclick="claimReward()">CLAIM</button>
            <button class="btn btn-full" onclick="connectWallet()">CONNECT WEB3</button>
        </div>

        <div id="walletDisplay" style="text-align:center; font-size:10px; color:#666; margin-top:10px;">NOT CONNECTED</div>
    </div>

    <script>
        // Init logic (ใช้โค้ดเดิมของคุณต่อได้เลยครับ ผมปรับแค่โครงสร้าง UI)
        // เพิ่มเติม: ปรับขนาดกราฟและ responsive
        const ctx = document.getElementById('miningChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: { labels: Array(12).fill(''), datasets: [{ data: [0.1, 0.3, 0.2, 0.5, 0.4, 0.7, 0.6, 0.9, 0.8, 1.1, 1.0, 1.2], borderColor: '#fbbf24', tension: 0.4, fill: true, backgroundColor: 'rgba(251,191,36,0.1)' }] },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { display: false } } }
        });

        // (Script อื่นๆ ของคุณคงไว้เหมือนเดิม)
    </script>
</body>
</html>
