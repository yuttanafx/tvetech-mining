.coin-ring{

);

ringFloat 5s ease-in-out infinite;
}

.coin-ring::before{

content:'';

position:absolute;

inset:-8px;

border-radius:50%;

border:
2px solid rgba(255,204,0,.25);

border-top:
2px solid #ffcc33;

2px solid #00ffaa;

animation:
spin 4s linear infinite;
}

.coin-ring::after{

content:'';

position:absolute;

border-radius:50%;

background:
radial-gradient(

rgba(255,255,255,.15),
transparent 70%
);

}

.coin-ring img{

z-index:5;

drop-shadow(

);
}

@keyframes spin{

0%{
transform:rotate(0deg);
}

100%{
transform:rotate(360deg);
}

}

@keyframes ringFloat{

0%,100%{
transform:
translateY(0px);
}

50%{

translateY(-8px);
}

}

/* ============================= */

.balance-title{

margin-top:10px;

}

.active-status{

margin-top:6px;

font-weight:700;

color:#00ff99;

}

@keyframes pulse{

0%,100%{
opacity:1;
}

50%{
opacity:.4;
}

}

/* ============================= */
/* GRID */
/* ============================= */

.grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:8px;

margin-top:12px;
}

.card{

height:68px;

padding:10px;

border-radius:18px;

background:
linear-gradient(
180deg,
rgba(0,18,40,.95),
rgba(0,10,20,.95)
);

border:
1px solid rgba(0,255,255,.14);

display:flex;
flex-direction:column;
justify-content:center;
}

.card-title{

font-size:10px;
color:#999;

margin-bottom:6px;
}

.card-value{

font-size:15px;
font-weight:800;

color:#ffc400;
}

/* ============================= */
/* GRAPH */
/* ============================= */

.graph-box{

height:120px;

margin-top:12px;

border-radius:20px;

overflow:hidden;

position:relative;

background:
linear-gradient(
180deg,
rgba(0,0,0,.35),
rgba(0,10,20,.95)
);

border:
1px solid rgba(255,191,0,.12);
}

.graph-glow{

position:absolute;

width:180px;
height:180px;

background:
radial-gradient(
circle,
rgba(255,204,0,.18),
transparent 70%
);

top:-50px;
left:-40px;

animation:
moveGlow 6s linear infinite;
}

@keyframes moveGlow{

0%{
transform:
translateX(0px);
}

50%{
transform:
translateX(180px);
}

100%{
transform:
translateX(0px);
}

}

svg{

position:absolute;
inset:0;

width:100%;
height:100%;
}

.graph-line{

fill:none;

stroke:url(#lineGradient);

stroke-width:4;

stroke-linecap:round;
stroke-linejoin:round;

filter:
drop-shadow(0 0 8px #ffcc33)
drop-shadow(0 0 18px #00ffaa);

stroke-dasharray:1200;
stroke-dashoffset:1200;

animation:
drawLine 4s linear infinite;
}

@keyframes drawLine{

0%{
stroke-dashoffset:1200;
}

100%{
stroke-dashoffset:0;
}

}

/* ============================= */
/* BUTTONS */
/* ============================= */

.bottom-buttons{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:10px;

margin-top:12px;
}

.action-btn{

height:50px;

border:none;
border-radius:16px;

font-size:12px;
font-weight:800;

color:#fff;

cursor:pointer;

transition:.25s;

letter-spacing:.5px;

box-shadow:
0 4px 15px rgba(0,0,0,.35);
}

.action-btn:active{

transform:scale(.95);
}

.mine-btn{

background:
linear-gradient(
135deg,
#00ff99,
#065f46
);
}

.stop-btn{

background:
linear-gradient(
135deg,
#ff4d4d,
#7f1d1d
);
}

.claim-btn{

linear-gradient(
135deg,
#ffcc33,
#ff8800
);

color:#111;
}

.web3-btn{

background:
linear-gradient(
135deg,
#8b5cf6,
#4c1d95
);
}

.add-btn{

background:
linear-gradient(
135deg,
#00c3ff,
#0047ab
);
}

.reset-btn{

background:
linear-gradient(
135deg,
#666,
#222
);
}

/* ============================= */
/* WALLET */
/* ============================= */

.wallet-box{

margin-top:10px;

padding:10px;

border-radius:14px;

background:
rgba(255,255,255,.03);

border:
1px solid rgba(255,255,255,.08);

font-size:12px;

text-align:center;
}

/* ============================= */
/* LOGIN */

.login{

position:fixed;

background:#020611;

display:flex;

z-index:999;
}

.login-box{

width:90%;

padding:25px;

background:
linear-gradient(
180deg,
rgba(0,10,20,.96),

);

border:

}

.login-box h2{

margin-bottom:20px;

}

.input{

width:100%;
height:48px;

border:none;

}

.login-btn{

width:100%;
height:50px;

border:none;

font-size:14px;
font-weight:800;

background:
linear-gradient(
135deg,

);
}

/* ============================= */
/* MOBILE */
/* ============================= */

@media(max-height:760px){

}

}

}

}

}

</style>
</head>

<body>

<div class="stars">

<span style="left:10%;animation-delay:0s"></span>
<span style="left:20%;animation-delay:1s"></span>

</div>

<!-- LOGIN -->

<div
id="loginSection"
class="login">

<div class="login-box">

<h2>
TVET ENERGY MINING
</h2>

<input
type="text"
id="userInput"
class="input"
placeholder="Username">

<input
type="password"
id="passInput"
class="input"
placeholder="Password">

<button
class="login-btn"
onclick="loginAction()">

ENTER SYSTEM

</button>

</div>
</div>

<!-- APP -->

<div class="app">

<div class="container">

<div class="topbar">

TVET NODE-07
</div>

</div>

</div>

<div class="center">

</div>

<div

id="balanceDisplay">

0.0000
<span>TVE</span>

</div>

</div>

</div>
<div class="card-value">
97.5%
</div>
</div>

<div class="card">
<div class="card-title">
HASH RATE
</div>
<div class="card-value">
132 TH/s
</div>
</div>

<div class="card">
<div class="card-title">
MINING SPEED
</div>
<div
class="card-value"
id="rateDisplay">
0.0000 TVE/s
</div>
</div>

<div class="card-title">

</div>
<div class="card-value">

</div>
</div>

<!-- GRAPH -->

<div class="graph-box">

<div class="graph-glow"></div>

<svg viewBox="0 0 400 120">

<defs>

<linearGradient
id="lineGradient"
x1="0%"
y1="0%"
x2="100%"

<stop
offset="0%"
stop-color="#00ffaa"/>

"/>

<!-- BUTTONS -->

<div class="bottom-buttons">

CLAIM TVE

<script>

/* ============================= */
/* DATABASE */
/* ============================= */

let user = null;

let mining = false;

let balance = 0;

let miningRate = 0;

let miningInterval = null;

const DB = {

"tvetech":{

pass:"tve2026",
rate:0.0100

},

"tve001":{

pass:"power999",
rate:0.0020

},

"varunya":{

pass:"tve789",
rate:0.0050

}

};

/* ============================= */
/* LOGIN */
/* ============================= */

function loginAction(){

const u =
document.getElementById(
"userInput"
).value.trim().toLowerCase();

const p =
document.getElementById(
"passInput"
).value.trim();

if(DB[u] &&
DB[u].pass === p){

user = u;

miningRate =
DB[u].rate;

document.getElementById(
"loginSection"
).style.display = "none";

document.getElementById(
"rateDisplay"
).innerText =

miningRate.toFixed(4)
+
" TVE/s";

loadBalance();

}else{

alert(
"INVALID LOGIN"
);

}

}

/* ============================= */
/* LOAD BALANCE */
/* ============================= */

function loadBalance(){

balance =
parseFloat(

localStorage.getItem(
"tvet_balance_" + user
)

|| 0

);

updateBalance();

}

/* ============================= */
/* UPDATE BALANCE */
/* ============================= */

function updateBalance(){

document.getElementById(
"balanceDisplay"
).innerHTML =

balance.toFixed(4)

+

' <span>TVE</span>';

}

/* ============================= */
/* MINING */
/* ============================= */

function toggleMining(){

const btn =
document.getElementById(
"mineBtn"
);

const active =
document.querySelector(
".active-status"
);

mining = !mining;

if(mining){

btn.innerText =
"STOP MINING";

btn.className =
"action-btn stop-btn";

active.innerHTML =
"● CARBON CREDIT ACTIVE";

active.style.color =
"#00ff99";

miningInterval =
setInterval(()=>{

balance += miningRate;

updateBalance();

localStorage.setItem(

"tvet_balance_" + user,

balance

);

},1000);

}else{

btn.innerText =
"START MINING";

btn.className =
"action-btn mine-btn";

active.innerHTML =
"● MINING PAUSED";

active.style.color =
"#ff5555";

clearInterval(
miningInterval
);

}

}

/* ============================= */
/* CONNECT */
/* ============================= */

async function connWallet(){

if(!window.ethereum){

alert(
"MetaMask Not Found"
);

return;
}

const provider =
new ethers.BrowserProvider(
window.ethereum
);

const signer =
await provider.getSigner();

const address =
await signer.getAddress();

document.getElementById(
"walletAddress"
).innerHTML =

address.substring(0,6)
+
"..."
+
address.substring(38);

}

/* ============================= */
/* CLAIM */
/* ============================= */

async function claimReward() {

if(balance <= 0){

alert("ไม่มีเหรียญ");
return;
}

try{

if(!window.ethereum){

alert("ไม่พบ MetaMask");
return;
}

const provider =
new ethers.BrowserProvider(
window.ethereum
);

const signer =
await provider.getSigner();

const userAddress =
await signer.getAddress();

const network =
await provider.getNetwork();

if(Number(network.chainId) !== 137){

alert(
"กรุณาเปลี่ยนเป็น Polygon Mainnet"
);

return;
}

const amountToClaim =
ethers.parseUnits(
balance.toFixed(4),
18
);

const response =
await fetch(

"https://tvet-mining.vercel.app/api/get-signature",

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

userAddress,

amount:
amountToClaim.toString()

})

});

const data =
await response.json();

if(!data.signature){

throw new Error(
"ไม่ได้ Signature"
);

}

const contract =
new ethers.Contract(

"0x170C62cAF21EE43A8527e0D858eB1ca76b79b342",

[
"function claimTokens(uint256 totalCumulativeAmount, bytes signature) external"
],

signer
);

const tx =
await contract.claimTokens(

amountToClaim,
data.signature

);

await tx.wait();

alert(
"โอนเหรียญสำเร็จ"
);

balance = 0;

updateBalance();

localStorage.setItem(

"tvet_balance_" + user,
0

);

}catch(err){

console.error(err);

alert(
"ERROR:\n" +
err.message
);

}

}

/* ============================= */
/* ADD TOKEN */
/* ============================= */

async function addTokenManual(){

if(!window.ethereum){

alert(
"MetaMask Not Found"
);

return;
}

try{

await window.ethereum.request({

method:'wallet_watchAsset',

params:{

type:'ERC20',

options:{

address:
'0x170C62cAF21EE43A8527e0D858eB1ca76b79b342',

symbol:'TVE',

decimals:18

}

}

});

}catch(err){

console.log(err);

}

}

/* ============================= */
/* RESET */
/* ============================= */

function resetBalance(){

if(confirm(
"รีเซตยอดทั้งหมด?"
)){

balance = 0;

updateBalance();

localStorage.setItem(
"tvet_balance_" + user,
0
);

}

}

</script>

</body>
</html>
