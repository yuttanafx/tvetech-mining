<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TVET NODE-07 | Advanced Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --gold: #fbbf24; --bg: #030305; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: #fff; }

        /* พื้นหลังเรืองแสง */
        .bg-glow { position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #030305 100%); }
        .grid-overlay { position: fixed; inset: 0; z-index: -1; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 50px 50px; }

        .app-container { width: 100%; max-width: 450px; height: 100vh; margin: auto; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }

        /* วงแหวนพลังงาน */
        .energy-reactor { position: relative; height: 200px; display: flex; align-items: center; justify-content: center; }
        .ring { position: absolute; width: 150px; height: 150px; border: 2px solid var(--gold); border-radius: 50%; animation: rotate 10s linear infinite; box-shadow: 0 0 20px var(--gold); }
        .ring:nth-child(2) { width: 180px; animation-direction: reverse; border-color: #9333ea; box-shadow: 0 0 20px #9333ea; }
        
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 15px; padding: 15px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .graph-box { flex-grow: 1; background: rgba(0,0,0,0.3); border-radius: 15px; padding: 10px; border: 1px solid rgba(255,255,255,0.1); margin: 10px 0; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-full { grid-column: span 2; background: #9333ea; color: white; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="grid-overlay"></div>

    <div class="app-container">
        <div class="top-header">
            <div style="font-size: 18px; font-weight: 900; letter-spacing: 2px;">TVET NODE-07</div>
        </div>

        <div class="energy-reactor">
            <div class="ring"></div>
            <div class="ring"></div>
            <img src="https://i.postimg.cc/ncjSwbjv/Gemini-Generated-Image-ncdze7ncdze7ncdz-removebg-preview.png" style="width: 80px; z-index: 1;">
        </div>

        <div class="dashboard-grid">
            <div class="stat-card"><div>EFFICIENCY</div><div style="color:var(--gold)">97.5%</div></div>
            <div class="stat-card"><div>HASH RATE</div><div style="color:var(--gold)">132 TH/s</div></div>
        </div>

        <div class="graph-box">
            <canvas id="miningChart"></canvas>
        </div>

        <div class="btn-group">
            <button class="btn" style="background:#ef4444; color:white;">STOP</button>
            <button class="btn" style="background:#10b981; color:white;">CLAIM</button>
            <button class="btn btn-full">CONNECT WEB3</button>
        </div>
    </div>

    <script>
       <script>
    // 1. ตั้งค่ากราฟ
    const ctx = document.getElementById('miningChart').getContext('2d');
    let graphData = Array(12).fill(0.5); // เริ่มต้นด้วยข้อมูล 12 จุด

    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: Array(12).fill(''),
            datasets: [{
                data: graphData,
                borderColor: '#fbbf24',
                borderWidth: 3,
                tension: 0.4, // เส้นโค้งมน
                fill: true,
                backgroundColor: 'rgba(251, 191, 36, 0.15)',
                pointRadius: 0 // ปิดจุดกลมให้เป็นเส้นกราฟล้วน
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 500, easing: 'linear' }, // อนิเมชั่นลื่นๆ
            plugins: { legend: { display: false } },
            scales: { y: { display: false }, x: { display: false } }
        }
    });

    // 2. ฟังก์ชันอัปเดตให้กราฟวิ่ง (Real-time)
    setInterval(() => {
        // ตัดค่าเก่าสุดออก แล้วเพิ่มค่าใหม่แบบสุ่ม
        graphData.shift();
        const lastValue = graphData[graphData.length - 1];
        const newValue = Math.max(0.2, Math.min(1.5, lastValue + (Math.random() - 0.5) * 0.4));
        graphData.push(newValue);
        
        // อัปเดตข้อมูลกราฟ
        chart.data.datasets[0].data = graphData;
        chart.update('none'); // อัปเดตแบบไม่กระตุก
    }, 800); // อัปเดตทุก 0.8 วินาที
   </script>
</body>
</html>
